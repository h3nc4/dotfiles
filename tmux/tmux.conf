# Key
unbind C-b
set -g prefix m-'\'
bind m-a send-prefix

# Bottom bar, battery left out on a host without BAT0
set -g status-right "#(date '+%H:%M | %a, %b %d')#(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | sed 's/.*/ | &%%/') "
set -g status-left " ${USER}@#H"
set -g window-status-format " #I:#W"
set -g window-status-current-format " #I:#W*"

# Initial window number
set -g base-index 1

# Default shell
set -g default-shell /bin/bash

# Enable mouse support
set -g mouse off

# Copy to the X clipboard, and through OSC 52 to the terminal over ssh
set -s copy-command "xclip -selection clipboard -in"
set -s set-clipboard on

# No lock
set -g lock-command ""

# Untoggle visuals
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Larger History
set-option -g history-limit 50000
